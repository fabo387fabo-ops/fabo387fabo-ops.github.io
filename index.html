<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pilos</title>
<meta name="description" content="The Pilos: 12 tiny friends with big personalities, racing, hiding, escaping and battling in a new game every video.">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1d1140; --bg2:#45208a; --ink:#ffffff; --muted:#d9cff5; --gold:#FFD45E; --red:#E8323C; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:radial-gradient(circle at 50% 20%, var(--bg2), var(--bg) 70%); color:var(--ink);
         font-family:Fredoka, system-ui, sans-serif; text-align:center; padding:48px 16px }
  h1 { font-size:clamp(56px, 14vw, 120px); margin:0; letter-spacing:.02em; line-height:1 }
  h1 span { -webkit-text-stroke:3px #fff; paint-order:stroke fill; text-shadow:0 6px 0 #120830 }
  .c1{color:#8E78C8}.c2{color:#F27DB0}.c3{color:#57DED8}.c4{color:#3FA66A}.c5{color:#F0525C}.c6{color:#FFD45E}
  p { font-size:20px; line-height:1.5; color:var(--muted); max-width:560px; margin:24px auto 0 }
  .btn { display:inline-block; margin-top:32px; padding:16px 36px; border-radius:999px; background:var(--red);
         color:#fff; font-weight:700; font-size:20px; text-decoration:none }
  .btn:hover { filter:brightness(1.1) }
  footer { margin-top:56px; font-size:15px; color:var(--muted) }
  footer a { color:var(--gold) }
</style>
</head>
<body>
  <h1><span class="c1">T</span><span class="c2">H</span><span class="c3">E</span> <span class="c4">P</span><span class="c5">I</span><span class="c1">L</span><span class="c2">O</span><span class="c3">S</span></h1>
  <p>One starry night, a little star fell… and Pilo arrived. Then came eleven more.<br>
     12 tiny friends with big personalities race, hide, escape and battle in a new game every video. Pick your favourite and guess who wins!</p>
  <a class="btn" href="https://www.youtube.com/@ThePilos">Watch on YouTube</a>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</body>
</html>
